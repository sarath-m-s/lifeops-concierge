# Render's free tier sleeps a service after 15 minutes idle and cold-starts in
# roughly 50 seconds — long enough to kill a live demo. A cheap GET every 10
# minutes keeps the instance up without any extra infrastructure.
#
# GitHub skips scheduled workflows on repos with no activity for 60 days, and
# cron firing time drifts under load. Neither matters for demo warmth.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://lifeops-concierge.onrender.com/health)
          echo "health returned $code"
          [ "$code" = "200" ]
